  #     DATABASE_URL: postgresql://eraffle:eraffle_pw@db:5432/eraffle_db
  #   depends_on:
  #     db:
  #       condition: service_healthy

  db:
    image: postgres:18
    container_name: e-raffle-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eraffle
      POSTGRES_PASSWORD: eraffle_pw
      POSTGRES_DB: eraffle_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eraffle -d eraffle_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
  pgadmin:
    image: dpage/pgadmin4
    container_name: e-raffle-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eraffle.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: 
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
